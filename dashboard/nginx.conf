server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /agents {
        proxy_pass http://server:3001;
    }

    location /jobs {
        proxy_pass http://server:3001;
    }

    location /events {
        proxy_pass http://server:3001;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    location /services {
        proxy_pass http://server:3001;
    }
}
